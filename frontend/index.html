<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <script>try{var t=localStorage.getItem('icevue.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
    <link rel="icon" href="/src/assets/icevue-mark.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Icevue is a read-only metadata explorer for Apache Iceberg REST catalogs."
    />
    <title>Icevue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
