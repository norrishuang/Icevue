[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icevue"
version = "0.1.0"
description = "A read-only web explorer for Apache Iceberg REST catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.35,<2.0",
  "fastapi>=0.115,<0.120",
  "pyarrow>=17,<22",
  "pyiceberg>=0.9,<0.11",
  "pydantic>=2.9,<2.12",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<0.40",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["icevue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
